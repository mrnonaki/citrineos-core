# Minimal RBAC so the app pods' `wait-migrate` initContainer can poll the
# migration Job's completion status. get/list/watch on jobs ONLY — no write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: citrineos-migrate-waiter
  namespace: citrineos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: citrineos-migrate-waiter
  namespace: citrineos
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: citrineos-migrate-waiter
  namespace: citrineos
subjects:
  - kind: ServiceAccount
    name: citrineos-migrate-waiter
    namespace: citrineos
roleRef:
  kind: Role
  name: citrineos-migrate-waiter
  apiGroup: rbac.authorization.k8s.io
