# citrine-router — OCPP message router. Patched from the boot-migrating baseline:
#   - command overridden to start node directly (NO db:migrate; that now runs
#     once in the citrineos-migrate Job),
#   - BOOTSTRAP_CITRINEOS_DATABASE_SYNC=false to kill the sync() auto-DDL path,
#   - wait-migrate initContainer blocks startup until the migrate Job completes.
# Safe to run replicas > 1: no pod touches schema DDL anymore.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citrine-router
  namespace: citrineos
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: citrine-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: citrine-router
    spec:
      serviceAccountName: citrineos-migrate-waiter
      initContainers:
        - name: wait-migrate
          image: docker.io/alpine/k8s:1.31.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "waiting for job/citrineos-migrate to exist..."
              until kubectl get job citrineos-migrate -n citrineos >/dev/null 2>&1; do sleep 3; done
              echo "waiting for job/citrineos-migrate to complete..."
              kubectl wait --for=condition=complete --timeout=300s job/citrineos-migrate -n citrineos
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      containers:
        - name: router
          image: localhost/citrineos-v2:beta4
          imagePullPolicy: Never
          # Bypass entrypoint.sh's db:migrate — start the app process directly.
          command:
            - /bin/sh
            - -c
            - cd /usr/local/apps/citrineos/apps/ocpp-server && exec node dist/index.js
          env:
            - name: APP_NAME
              value: router
            - name: APP_ENV
              value: docker
            - name: BOOTSTRAP_CITRINEOS_DATABASE_HOST
              value: ocpp-db
            - name: BOOTSTRAP_CITRINEOS_DATABASE_SYNC
              value: "false"
            - name: BOOTSTRAP_CITRINEOS_CONFIG_FILENAME
              value: config.json
            - name: BOOTSTRAP_CITRINEOS_FILE_ACCESS_TYPE
              value: local
            - name: BOOTSTRAP_CITRINEOS_FILE_ACCESS_LOCAL_DEFAULT_FILE_PATH
              value: /data
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CITRINEOS_util_messageBroker_amqp_instanceIdentifier
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CITRINEOS_util_cache_redis_url
              value: redis://redis:6379
          ports:
            - containerPort: 8080
            - containerPort: 8081
            - containerPort: 8082
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1", memory: 1Gi }
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - emptyDir: {}
          name: data
