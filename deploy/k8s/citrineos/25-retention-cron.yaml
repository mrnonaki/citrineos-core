# Nightly retention for CitrineOS's unbounded per-message tables.
#
# Upstream never deletes ANYTHING: the router logs every OCPP message (both
# directions, full payload) into "OCPPMessages" (router.ts → webhook.dispatcher →
# createOCPPMessage), and MeterValues/StatusNotifications accumulate per sample.
# Measured on a small production fleet: OCPPMessages was ~80% of the database
# (81 MB / 183k rows in 51 days) — roughly 1–1.5 MB/day per idle charger.
#
# What is safe to delete and why:
#   - OCPPMessages         raw wire log; diagnostics only, nothing reads it back
#   - MeterValues          consumed live-only (latest row per active tx); kept
#                          longer than OCPPMessages as the structured forensic
#                          trail for billing disputes after the raw log is gone
#   - StatusNotifications  consumers read newest-per-connector only (id desc)
# NEVER deleted here: Transactions / TransactionEvents (billing record, tiny)
# and everything else.
#
# Retention windows are env-tunable on the CronJob (days):
#   RETENTION_OCPP_MESSAGES_DAYS=30  RETENTION_METER_VALUES_DAYS=90
#   RETENTION_STATUS_NOTIFICATIONS_DAYS=30
#
# Deletes run in batches of 10k by ctid so a first run against a huge backlog
# neither takes a long table lock nor blows the WAL; VACUUM ANALYZE afterwards
# returns the space to reuse and refreshes planner stats.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: citrineos-retention
  namespace: citrineos
spec:
  schedule: "17 19 * * *"   # 19:17 UTC = 02:17 Asia/Bangkok, nightly off-peak
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: citrineos-retention
        spec:
          restartPolicy: Never
          containers:
            - name: retention
              # Same image as ocpp-db — psql included, already present on the nodes.
              image: docker.io/imresamu/postgis:16-3.5
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: ocpp-db
                - name: PGUSER
                  value: citrine
                - name: PGPASSWORD
                  value: citrine   # dev credentials — move to a Secret beyond local dev (see README)
                - name: PGDATABASE
                  value: citrine
                - name: RETENTION_OCPP_MESSAGES_DAYS
                  value: "30"
                - name: RETENTION_METER_VALUES_DAYS
                  value: "90"
                - name: RETENTION_STATUS_NOTIFICATIONS_DAYS
                  value: "30"
              command:
                - /bin/sh
                - -ec
                - |
                  purge() { # purge <table> <days>
                    tbl="$1"; days="$2"; total=0
                    echo "retention: \"$tbl\" older than ${days}d"
                    while :; do
                      n=$(psql -qtAc "WITH del AS (
                            DELETE FROM \"$tbl\" WHERE ctid IN (
                              SELECT ctid FROM \"$tbl\"
                              WHERE \"createdAt\" < now() - make_interval(days => ${days})
                              LIMIT 10000)
                            RETURNING 1)
                          SELECT count(*) FROM del;")
                      total=$((total + n))
                      [ "$n" -lt 10000 ] && break
                    done
                    echo "retention: \"$tbl\" deleted ${total} rows"
                    psql -qc "VACUUM (ANALYZE) \"$tbl\";"
                  }
                  purge OCPPMessages        "${RETENTION_OCPP_MESSAGES_DAYS}"
                  purge MeterValues         "${RETENTION_METER_VALUES_DAYS}"
                  purge StatusNotifications "${RETENTION_STATUS_NOTIFICATIONS_DAYS}"
                  echo "retention: done"
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
